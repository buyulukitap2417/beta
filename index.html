<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATOTA Dijital | Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        :root { --color-primary: #0284c7; --color-secondary: #06b6d4; }

        .loading-ambient-bg {
            background-color: #f8fafc;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, rgba(129, 140, 248, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 20% 85%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
                radial-gradient(rgba(14, 165, 233, 0.05) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 32px 32px;
        }

        .glass-login-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 30px 70px -15px rgba(2, 132, 199, 0.15), 0 15px 30px -10px rgba(15, 23, 42, 0.06);
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            50% { transform: translate(60px, -45px) scale(1.18); opacity: 1; }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.75; }
            50% { transform: translate(-70px, 45px) scale(1.15); opacity: 0.95; }
        }

        .pulse-brand {
            animation: pulseLogo 2.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px 0px rgba(2, 132, 199, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px 10px rgba(2, 132, 199, 0.35); }
        }
    </style>
</head>
<body class="min-h-screen loading-ambient-bg flex items-center justify-center p-4 overflow-hidden">

    <!-- Aurora küreleri -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden select-none">
        <div class="absolute -top-32 -left-32 w-[32rem] h-[32rem] rounded-full bg-gradient-to-br from-sky-400/30 via-cyan-300/25 to-blue-500/20 filter blur-[100px]" style="animation: orbFloat1 11s ease-in-out infinite;"></div>
        <div class="absolute -bottom-36 -right-36 w-[34rem] h-[34rem] rounded-full bg-gradient-to-tl from-indigo-400/30 via-purple-300/20 to-sky-400/25 filter blur-[110px]" style="animation: orbFloat2 13s ease-in-out infinite;"></div>
    </div>

    <!-- Giriş Kartı -->
    <div id="login-card" class="relative z-10 w-full max-w-md p-8 sm:p-10 rounded-3xl glass-login-card flex flex-col items-center transition-all duration-500">
        <div class="w-24 h-24 rounded-3xl bg-white border-2 border-slate-100 flex items-center justify-center p-4 shadow-xl shadow-slate-200/50 pulse-brand mb-5">
            <i class="fa-solid fa-shapes text-4xl text-[var(--color-primary)]"></i>
        </div>
        <h1 class="text-2xl font-black uppercase tracking-tight text-slate-800 font-outfit">Güvenli Giriş</h1>
        <p class="text-xs text-slate-500 font-semibold mt-1 mb-6">Devam etmek için erişim şifresini girin</p>

        <div class="w-full space-y-4">
            <div>
                <label for="password-input" class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5">Erişim Şifresi</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="password" id="password-input" placeholder="••••••••" autocomplete="off"
                        class="w-full pl-10 pr-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[var(--color-primary)] focus:ring-2 focus:ring-[var(--color-primary)]/20 transition"
                        onkeydown="if(event.key==='Enter') handleLogin()">
                </div>
            </div>

            <p id="error-message" class="hidden text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2 text-center">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> Hatalı şifre, tekrar deneyin.
            </p>

            <button onclick="handleLogin()" id="login-btn"
                class="w-full py-3.5 rounded-2xl bg-[var(--color-primary)] hover:opacity-90 text-white font-black text-xs uppercase tracking-widest transition shadow-lg shadow-sky-500/25 flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Giriş Yap
            </button>
        </div>

        <div class="mt-6 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-900/[0.03] border border-slate-200/80">
            <span class="relative flex h-2 w-2 shrink-0">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <i class="fa-solid fa-lock text-emerald-600 text-xs"></i>
            <span class="text-[10px] font-bold tracking-tight text-slate-600">256-Bit Uçtan Uca Korumalı</span>
        </div>
    </div>

    <!-- İframe alanı (başlangıçta gizli) -->
    <div id="portal-container" class="hidden fixed inset-0 w-full h-full z-20">
        <iframe id="portal-iframe" style="width:100%; height:100%; border:none;" allowfullscreen="true" allow="fullscreen; autoplay; clipboard-write"></iframe>
    </div>

    <script>
        const SUPABASE_PROJECT_ID = 'zbvycdcpumwboqeeylps';
        const EDGE_FUNCTION_URL = `https://zbvycdcpumwboqeeylps.supabase.co/functions/v1/portal-password`;
        const PORTAL_URL = 'https://embed.matota.online/loader.html?key=057b1300-a005-4440-8cda-964667303445';

        // Oturum içinde tekrar şifre sormamak için (isteğe bağlı)
        if (sessionStorage.getItem('matota_authenticated') === 'true') {
            showPortal();
        }

        async function handleLogin() {
            const input = document.getElementById('password-input');
            const errorEl = document.getElementById('error-message');
            const btn = document.getElementById('login-btn');
            const password = input.value.trim();

            if (!password) {
                errorEl.textContent = 'Lütfen şifreyi girin.';
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Doğrulanıyor...';
            errorEl.classList.add('hidden');

            try {
                const res = await fetch(EDGE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (res.ok && data.ok) {
                    sessionStorage.setItem('matota_authenticated', 'true');
                    showPortal();
                } else {
                    errorEl.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i> ' + (data.error || 'Hatalı şifre, tekrar deneyin.');
                    errorEl.classList.remove('hidden');
                    input.value = '';
                    input.focus();
                }
            } catch (err) {
                errorEl.innerHTML = '<i class="fa-solid fa-plug-circle-xmark mr-1"></i> Bağlantı hatası. Lütfen tekrar deneyin.';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Giriş Yap';
            }
        }

        function showPortal() {
            document.getElementById('login-card').classList.add('hidden');
            const container = document.getElementById('portal-container');
            const iframe = document.getElementById('portal-iframe');
            iframe.src = PORTAL_URL;
            container.classList.remove('hidden');
        }

        // Sayfa yüklendiğinde input'a odaklan
        document.getElementById('password-input')?.focus();
    </script>
</body>
</html>
