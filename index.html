<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MATOTA | Beta Öğrenme Portalı</title>
    <link rel="icon" type="image/png" href="/assets/personal/fav.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --color-primary: #7c3aed;
            --color-primary-dark: #5b21b6;
            --color-primary-light: #c084fc;
            --color-primary-glow: rgba(124, 58, 237, .25);
            --ink: #172033;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Plus Jakarta Sans", Inter, Arial, sans-serif;
            background: #f7f8ff;
            color: var(--ink);
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 8% 5%, rgba(192, 132, 252, .28), transparent 32%),
                radial-gradient(circle at 92% 12%, rgba(56, 189, 248, .22), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(167, 139, 250, .18), transparent 38%);
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .25;
            pointer-events: none;
            background-image: radial-gradient(#8b5cf6 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(to bottom, black, transparent 75%);
        }
        .glass {
            background: rgba(255, 255, 255, .72);
            border: 1px solid rgba(255, 255, 255, .85);
            box-shadow: 0 18px 55px rgba(76, 29, 149, .10);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }
        .card {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background: rgba(255, 255, 255, .82);
            border: 1px solid rgba(255, 255, 255, .9);
            box-shadow: 0 14px 35px rgba(30, 41, 59, .09);
            transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease, border-color .35s ease;
        }
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: 0;
            background: linear-gradient(135deg, rgba(124,58,237,.11), transparent 55%);
            transition: opacity .35s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(167, 139, 250, .7);
            box-shadow: 0 24px 55px rgba(76, 29, 149, .18);
        }
        .card:hover::after { opacity: 1; }
        .card:active { transform: translateY(-3px) scale(.99); }
        .hero-title { background: linear-gradient(100deg, #312e81, #7c3aed 45%, #0891b2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .beta-pill { box-shadow: 0 8px 24px rgba(124,58,237,.22); }
        .loading-orb { animation: floatOrb 7s ease-in-out infinite; }
        .loading-orb:nth-child(2) { animation-delay: -2s; animation-duration: 9s; }
        .loading-orb:nth-child(3) { animation-delay: -4s; animation-duration: 11s; }
        .loading-ring { animation: spin 1.5s linear infinite; }
        .lock-shield { box-shadow: 0 0 0 12px rgba(255,255,255,.08), 0 20px 60px rgba(127,29,29,.35); }
        #game-view { background: #020617; }
        @keyframes floatOrb { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(35px,-28px,0) scale(1.12); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
    <script src="/security-lock.js"></script>
</head>
<body class="min-h-screen">
    <div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center overflow-hidden bg-[#f7f8ff] p-6 text-center">
        <div class="absolute -top-32 -left-20 h-80 w-80 rounded-full bg-violet-300/30 blur-3xl loading-orb"></div>
        <div class="absolute -right-24 top-20 h-96 w-96 rounded-full bg-cyan-300/25 blur-3xl loading-orb"></div>
        <div class="absolute bottom-0 left-1/3 h-72 w-72 rounded-full bg-fuchsia-300/20 blur-3xl loading-orb"></div>
        <div class="relative glass rounded-[2rem] px-8 py-10 max-w-sm w-full">
            <div class="mx-auto mb-6 relative h-20 w-20 rounded-[1.7rem] bg-gradient-to-br from-violet-600 to-fuchsia-500 text-white flex items-center justify-center text-3xl shadow-xl shadow-violet-500/30">
                <i class="fa-solid fa-flask"></i><span class="absolute -right-2 -top-2 h-7 w-7 rounded-full bg-cyan-400 border-4 border-white flex items-center justify-center text-[10px]"><i class="fa-solid fa-sparkles"></i></span>
            </div>
            <div class="inline-flex beta-pill items-center gap-2 rounded-full bg-violet-100 px-3 py-1 text-[10px] font-black uppercase tracking-[.2em] text-violet-700"><span class="h-2 w-2 rounded-full bg-violet-500 animate-pulse"></span>Beta erişimi</div>
            <h1 class="mt-4 text-2xl font-black tracking-tight text-slate-900">Öğrenme alanın hazırlanıyor</h1>
            <p class="mt-2 text-sm leading-6 text-slate-500">Güvenli içerik doğrulanıyor, maceran birazdan başlıyor.</p>
            <div class="mt-7 h-1.5 overflow-hidden rounded-full bg-violet-100"><div class="h-full w-1/2 rounded-full bg-gradient-to-r from-violet-600 via-fuchsia-500 to-cyan-400 loading-ring"></div></div>
        </div>
    </div>
    <div id="lock" class="hidden fixed inset-0 z-50 overflow-hidden bg-gradient-to-br from-rose-950 via-red-800 to-violet-950 text-white flex items-center justify-center p-6 text-center">
        <div class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-rose-400/20 blur-3xl"></div>
        <div class="relative max-w-md glass !bg-white/10 !border-white/20 rounded-[2rem] p-9">
            <div class="lock-shield mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-3xl bg-white/15 text-3xl text-rose-100"><i class="fa-solid fa-lock"></i></div>
            <div class="text-[10px] font-black uppercase tracking-[.25em] text-rose-200">Güvenlik bildirimi</div>
            <h1 class="mt-3 text-3xl font-black tracking-tight">BETA ERİŞİMİ KİLİTLİ</h1>
            <p id="lock-message" class="mt-4 leading-6 text-rose-100"></p>
        </div>
    </div>
    <header id="header" class="hidden sticky top-0 z-10 glass border-b border-white/60">
        <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <img id="logo" class="hidden w-12 h-12 object-contain rounded-2xl border border-white bg-white/80 p-1.5 shadow-sm" alt="Kurum logosu">
                <div><h1 id="client-name" class="font-black uppercase tracking-tight text-slate-900">MATOTA</h1><p class="text-[10px] text-violet-600 font-black uppercase tracking-[.18em]">Beta içerik alanı</p></div>
            </div>
            <span id="beta-expiry" class="rounded-full bg-white/80 px-3 py-2 text-[10px] font-bold text-slate-500 text-right shadow-sm"></span>
        </div>
    </header>
    <main id="portal" class="hidden max-w-7xl mx-auto px-5 py-10">
        <div class="flex items-end justify-between gap-4 mb-6">
            <div><div class="mb-2 inline-flex items-center gap-2 rounded-full bg-violet-100 px-3 py-1 text-[10px] font-black uppercase tracking-[.18em] text-violet-700"><i class="fa-solid fa-wand-magic-sparkles"></i> Sana özel seçkiler</div><h2 id="title" class="hero-title text-3xl sm:text-4xl font-black">Beta oyunları</h2><p class="text-sm text-slate-500 mt-2">Bu alanda yalnızca beta için yetkilendirilen oyunlar gösterilir.</p></div>
            <button id="back" class="hidden rounded-2xl bg-white/80 px-4 py-2.5 text-xs font-black text-slate-700 shadow-sm border border-white hover:bg-white hover:text-violet-700"><i class="fa-solid fa-arrow-left mr-2"></i>Geri</button>
        </div>
        <div id="items" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>
    <div id="game-view" class="hidden fixed inset-0 z-40 flex flex-col">
        <div class="h-16 shrink-0 bg-slate-900/95 border-b border-violet-500/20 px-4 sm:px-6 flex items-center justify-between gap-3">
            <div class="flex min-w-0 items-center gap-3"><span class="rounded-xl bg-violet-500/20 px-2.5 py-1 text-[10px] font-black uppercase text-violet-300">BETA</span><h2 id="game-title" class="text-white text-sm font-bold truncate"></h2></div>
            <button id="close-game" class="bg-violet-600 hover:bg-violet-500 text-white rounded-xl px-4 py-2.5 text-xs font-black shadow-lg shadow-violet-900/30"><i class="fa-solid fa-arrow-left mr-2"></i>Portala dön</button>
        </div>
        <iframe id="game-frame" class="w-full flex-1 border-0" allowfullscreen allow="fullscreen; autoplay; clipboard-write" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-same-origin"></iframe>
    </div>
    <script>
        const apiKey = new URLSearchParams(location.search).get('key');
        let data = null, currentParent = null, historyStack = [];
        const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
        const device = /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
        function showLock(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('lock').classList.remove('hidden');
            document.getElementById('lock-message').textContent = message || 'Beta lisansınız doğrulanamadı.';
        }
        function childrenOf(parentId) {
            const itemIds = new Set((data.items || []).map(item => String(item.id)));
            return (data.items || []).filter(item => {
                if (parentId !== null) return String(item.parent_id) === String(parentId);
                return !item.parent_id || item.parent_id === 'null' || item.parent_id === '' || !itemIds.has(String(item.parent_id));
            });
        }
        function render(parentId = null) {
            currentParent = parentId;
            const items = childrenOf(parentId);
            document.getElementById('back').classList.toggle('hidden', historyStack.length === 0);
            document.getElementById('items').innerHTML = items.length ? items.map(item => {
                const isFolder = Boolean(item.is_folder), title = esc(item.title || item.name || 'İsimsiz oyun');
                const image = item.cover_image_url
                    ? `<img src="${esc(item.cover_image_url)}" alt="${title}" class="h-44 w-full object-cover transition duration-500 group-hover:scale-110">`
                    : `<div class="flex h-44 w-full items-center justify-center bg-gradient-to-br from-violet-100 via-fuchsia-50 to-cyan-50 text-5xl text-violet-400"><i class="fa-solid ${isFolder ? 'fa-folder-open' : 'fa-gamepad'}"></i></div>`;
                const category = esc(item.category || (isFolder ? 'İçerik klasörü' : 'İnteraktif oyun'));
                return `<button data-id="${esc(item.id)}" data-folder="${isFolder}" class="card group rounded-[1.35rem] text-left">
                    <div class="relative overflow-hidden">${image}<div class="absolute inset-0 bg-gradient-to-t from-slate-950/65 via-transparent to-transparent"></div>
                        <span class="absolute left-3 top-3 rounded-full bg-white/90 px-2.5 py-1 text-[9px] font-black uppercase tracking-wider text-violet-700 shadow-sm">${isFolder ? 'Klasör' : 'Beta seçkisi'}</span>
                        <span class="absolute bottom-3 left-3 text-[10px] font-bold text-white"><i class="fa-solid ${isFolder ? 'fa-layer-group' : 'fa-sparkles'} mr-1.5 text-cyan-300"></i>${category}</span>
                    </div>
                    <div class="p-5"><h3 class="font-black leading-snug text-slate-900">${title}</h3>
                        <div class="mt-4 flex items-center justify-between border-t border-slate-100 pt-3 text-[10px] font-black uppercase tracking-wider text-violet-600"><span>${isFolder ? 'İçeriği keşfet' : 'Oyunu başlat'}</span><i class="fa-solid fa-arrow-right transition-transform group-hover:translate-x-1"></i></div>
                    </div>
                </button>`;
            }).join('') : '<div class="col-span-full py-20 text-center text-slate-500 text-sm">Bu beta erişiminde henüz oyun seçilmemiş.</div>';
            document.querySelectorAll('#items button').forEach(button => button.onclick = () => {
                if (button.dataset.folder === 'true') { historyStack.push(currentParent); render(button.dataset.id); } else openGame(button.dataset.id);
            });
        }
        async function openGame(id) {
            const game = data.items.find(item => String(item.id) === String(id));
            if (!game) return;
            document.getElementById('game-title').textContent = game.title || game.name || 'Oyun';
            document.getElementById('game-view').classList.remove('hidden');
            try {
                const response = await fetch('/api/game?id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(apiKey) + '&beta=true&device=' + device);
                const result = await response.json();
                if (!response.ok || !result.html) throw new Error(result.error || 'Oyun içeriği alınamadı.');
                const client = data.client || {};
                const injection = '<script>' +
                    'window.EMBED_API_KEY=' + JSON.stringify(apiKey) + ';' +
                    'window.EMBED_IS_BETA=true;' +
                    'window.EMBED_IS_WHITE_LABEL=' + JSON.stringify(Boolean(client.is_white_label)) + ';' +
                    'window.EMBED_CLIENT_LOGO=' + JSON.stringify(client.logo_url || '') + ';' +
                    'window.EMBED_CLIENT_NAME=' + JSON.stringify(client.name || '') + ';' +
                    'window.EMBED_CLIENT_COLOR=' + JSON.stringify(client.theme_primary_color || '#7c3aed') + ';' +
                    '<\/script>';
                document.getElementById('game-frame').src = URL.createObjectURL(new Blob([injection + result.html], { type: 'text/html' }));
            } catch (error) { document.getElementById('game-view').classList.add('hidden'); showLock(error.message); }
        }
        window.addEventListener('message', event => {
            const gameFrame = document.getElementById('game-frame');
            if (!gameFrame || event.source !== gameFrame.contentWindow) return;
            if (event.data && event.data.type === 'MATOTA_HANDSHAKE_INIT' && event.source) {
                event.source.postMessage({ type: 'MATOTA_HANDSHAKE_ACK' }, '*');
            }
        });
        document.getElementById('back').onclick = () => render(historyStack.pop() ?? null);
        document.getElementById('close-game').onclick = () => { document.getElementById('game-view').classList.add('hidden'); document.getElementById('game-frame').src = 'about:blank'; };
        (async function init() {
            if (!apiKey) return showLock('Beta lisans anahtarı bulunamadı.');
            try {
                const response = await fetch('/api/portal?key=' + encodeURIComponent(apiKey) + '&beta=true');
                const result = await response.json();
                if (!response.ok || !result.success || !result.is_beta) throw new Error(result.error || 'Beta erişimi reddedildi.');
                data = result;
                document.getElementById('client-name').textContent = result.client.name || 'MATOTA';
                if (result.client.logo_url) { const logo = document.getElementById('logo'); logo.src = result.client.logo_url; logo.classList.remove('hidden'); }
                if (result.client.beta_expires_at) document.getElementById('beta-expiry').textContent = 'Beta bitişi: ' + new Date(result.client.beta_expires_at).toLocaleDateString('tr-TR');
                render();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('header').classList.remove('hidden');
                document.getElementById('portal').classList.remove('hidden');
            } catch (error) { showLock(error.message); }
        })();
    </script>
</body>
</html>
